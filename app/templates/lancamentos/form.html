<div class="modal-box p-6 w-full max-w-lg">
  <div class="flex items-center justify-between mb-4">
    <h2 class="font-cinzel tracking-wider" style="color:var(--dourado);">
      {{ 'EDITAR' if lancamento else 'NOVO' }} LANÇAMENTO
    </h2>
    <button onclick="closeModal()" style="color:var(--dourado-claro);opacity:.6;" class="hover:opacity-100">
      <i data-feather="x" class="w-5 h-5"></i>
    </button>
  </div>
  <div class="gold-line mb-5"></div>

  {% if error %}
  <div class="mb-4 p-3 rounded text-sm" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;">{{ error }}</div>
  {% endif %}

  <form method="post"
    action="/lancamentos/{{ lancamento.id }}/editar" {% if lancamento else 'action="/lancamentos/novo"' %}
    {% if not lancamento %}action="/lancamentos/novo"{% endif %}
    hx-post="{{ '/lancamentos/' + lancamento.id|string + '/editar' if lancamento else '/lancamentos/novo' }}"
    hx-target="#modal-container"
    hx-swap="innerHTML"
    class="flex flex-col gap-4">

    <div class="grid grid-cols-2 gap-4">
      <div class="col-span-2">
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Descrição *</label>
        <input type="text" name="descricao" required value="{{ lancamento.descricao if lancamento else '' }}" />
      </div>
      <div>
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Tipo *</label>
        <select name="tipo" required>
          <option value="entrada" {% if lancamento and lancamento.tipo == 'entrada' %}selected{% endif %}>Entrada</option>
          <option value="saida" {% if lancamento and lancamento.tipo == 'saida' %}selected{% endif %}>Saída</option>
        </select>
      </div>
      <div>
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Valor Total *</label>
        <input type="number" name="valor_total" step="0.01" min="0.01" required
          value="{{ lancamento.valor_total if lancamento else '' }}" />
      </div>
      <div>
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Data de Competência *</label>
        <input type="date" name="data_competencia" required
          value="{{ lancamento.data_competencia.strftime('%Y-%m-%d') if lancamento else '' }}" />
      </div>
      <div>
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Categoria</label>
        <select name="categoria_id">
          <option value="">— Sem categoria —</option>
          {% for grupo in grupos_categorias %}
            {% if grupo.pai %}
            <optgroup label="{{ grupo.pai.nome }}">
              {% for filho in grupo.filhos %}
              <option value="{{ filho.id }}" {% if lancamento and lancamento.categoria_id == filho.id %}selected{% endif %}>
                {{ filho.nome }}
              </option>
              {% endfor %}
            </optgroup>
            {% else %}
            {% for filho in grupo.filhos %}
            <option value="{{ filho.id }}" {% if lancamento and lancamento.categoria_id == filho.id %}selected{% endif %}>
              {{ filho.nome }}
            </option>
            {% endfor %}
            {% endif %}
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Centro de Custo</label>
        <select name="centro_custo_id">
          <option value="">— Nenhum —</option>
          {% for c in centros %}
          <option value="{{ c.id }}" {% if lancamento and lancamento.centro_custo_id == c.id %}selected{% endif %}>{{ c.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-span-2">
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Observação</label>
        <textarea name="observacao" rows="2" style="width:100%;resize:vertical;">{{ lancamento.observacao or '' }}</textarea>
      </div>
    </div>

    <div class="flex gap-3 mt-2">
      <button type="submit" class="btn-primary flex-1 py-2 rounded font-cinzel tracking-wider text-sm">SALVAR</button>
      <button type="button" onclick="closeModal()" class="btn-secondary flex-1 py-2 rounded text-sm">CANCELAR</button>
    </div>
  </form>
</div>
<script>feather.replace();</script>
