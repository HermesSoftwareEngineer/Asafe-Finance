<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Ministério Asafe Vocal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --azul-profundo:#0A2540; --azul-escuro:#061826; --dourado:#D4AF37; --dourado-claro:#F5E6A7; --dourado-escuro:#B8860B; --branco-suave:#F8F8F8; }
    body { background-color: var(--azul-profundo); font-family: 'Montserrat', sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-great  { font-family: 'Great Vibes', cursive; }
    input { background-color: var(--azul-escuro) !important; border: 1px solid rgba(212,175,55,0.3) !important; color: var(--branco-suave) !important; border-radius: 6px !important; padding: .6rem .75rem !important; width: 100%; }
    input:focus { border-color: var(--dourado) !important; outline: none !important; box-shadow: 0 0 0 2px rgba(212,175,55,0.2) !important; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="font-great text-5xl mb-2" style="color: var(--dourado);">Ministério Asafe Vocal</div>
      <div class="font-cinzel tracking-widest text-sm" style="color: var(--dourado-claro); opacity:.7;">SISTEMA FINANCEIRO</div>
    </div>

    <div style="background: var(--azul-escuro); border: 1px solid rgba(212,175,55,0.25); border-radius: 10px;" class="p-8 shadow-2xl">
      <h2 class="font-cinzel text-xl mb-6 text-center" style="color: var(--dourado);">Acesso ao Sistema</h2>

      {% if error %}
      <div class="mb-4 p-3 rounded text-sm" style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5;">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="flex flex-col gap-4">
        <div>
          <label class="block text-sm mb-1" style="color: var(--dourado-claro);">E-mail</label>
          <input type="email" name="email" required placeholder="seu@email.com" autocomplete="email" />
        </div>
        <div>
          <label class="block text-sm mb-1" style="color: var(--dourado-claro);">Senha</label>
          <input type="password" name="password" required placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="mt-2 py-2 px-4 rounded font-cinzel tracking-wider text-sm font-semibold transition-all"
          style="background: var(--dourado); color: var(--azul-escuro);"
          onmouseover="this.style.background='var(--dourado-escuro)'"
          onmouseout="this.style.background='var(--dourado)'">
          ENTRAR
        </button>
      </form>
    </div>

    <p class="text-center mt-6 text-xs" style="color: rgba(245,230,167,0.4);">
      © 2024 Ministério Asafe Vocal
    </p>
  </div>
</body>
</html>
