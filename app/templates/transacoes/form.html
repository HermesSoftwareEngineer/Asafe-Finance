<div class="modal-box p-6 w-full max-w-lg">
  <div class="flex items-center justify-between mb-4">
    <h2 class="font-cinzel tracking-wider" style="color:var(--dourado);">
      {{ 'EDITAR' if transacao else 'NOVA' }} TRANSAÇÃO
    </h2>
    <button onclick="closeModal()" style="color:var(--dourado-claro);opacity:.6;"><i data-feather="x" class="w-5 h-5"></i></button>
  </div>
  <div class="gold-line mb-5"></div>

  {% if error %}
  <div class="mb-4 p-3 rounded text-sm" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;">{{ error }}</div>
  {% endif %}

  <form hx-post="{{ '/transacoes/' + transacao.id|string + '/editar' if transacao else '/transacoes/nova' }}"
    hx-target="#modal-container" hx-swap="innerHTML" class="flex flex-col gap-4">
    <div class="grid grid-cols-2 gap-4">
      <div class="col-span-2">
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Descrição *</label>
        <input type="text" name="descricao" required value="{{ transacao.descricao if transacao else '' }}" />
      </div>
      <div>
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Tipo *</label>
        <select name="tipo" required>
          <option value="entrada" {% if transacao and transacao.tipo == 'entrada' %}selected{% endif %}>Entrada</option>
          <option value="saida" {% if transacao and transacao.tipo == 'saida' %}selected{% endif %}>Saída</option>
        </select>
      </div>
      <div>
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Valor *</label>
        <input type="number" name="valor" step="0.01" min="0.01" required value="{{ transacao.valor if transacao else '' }}" />
      </div>
      <div>
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Data de Pagamento *</label>
        <input type="date" name="data_pagamento" required value="{{ transacao.data_pagamento.strftime('%Y-%m-%d') if transacao else '' }}" />
      </div>
      <div>
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Conta *</label>
        <select name="conta_id" required>
          {% for c in contas %}
          <option value="{{ c.id }}" {% if transacao and transacao.conta_id == c.id %}selected{% endif %}>{{ c.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-span-2">
        <label class="block text-xs mb-1" style="color:var(--dourado-claro);">Forma de Pagamento *</label>
        <select name="forma_pagamento" required>
          {% for forma in ['pix', 'boleto', 'ted', 'doc', 'debito', 'credito', 'dinheiro', 'outro'] %}
          <option value="{{ forma }}" {% if transacao and transacao.forma_pagamento == forma %}selected{% endif %}>{{ forma|upper }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="flex gap-3 mt-2">
      <button type="submit" class="btn-primary flex-1 py-2 rounded font-cinzel tracking-wider text-sm">SALVAR</button>
      <button type="button" onclick="closeModal()" class="btn-secondary flex-1 py-2 rounded text-sm">CANCELAR</button>
    </div>
  </form>
</div>
<script>feather.replace();</script>
