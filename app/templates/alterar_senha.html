{% extends "base.html" %}
{% block title %}Alterar Senha{% endblock %}
{% block page_title %}Alterar Senha{% endblock %}

{% block content %}
<div class="max-w-md">
  <div class="card p-6">
    {% if error %}
    <div class="mb-4 p-3 rounded text-sm" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="mb-4 p-3 rounded text-sm" style="background:rgba(76,175,125,0.1);border:1px solid rgba(76,175,125,0.3);color:#4CAF7D;">{{ success }}</div>
    {% endif %}

    <form method="post" action="/alterar-senha" class="flex flex-col gap-4">
      <div>
        <label class="block text-sm mb-1" style="color:var(--dourado-claro);">Senha Atual</label>
        <input type="password" name="senha_atual" required />
      </div>
      <div>
        <label class="block text-sm mb-1" style="color:var(--dourado-claro);">Nova Senha</label>
        <input type="password" name="nova_senha" required minlength="6" />
      </div>
      <div>
        <label class="block text-sm mb-1" style="color:var(--dourado-claro);">Confirmar Nova Senha</label>
        <input type="password" name="confirmar_senha" required minlength="6" />
      </div>
      <button type="submit" class="btn-primary py-2 px-4 rounded font-cinzel tracking-wider text-sm">SALVAR</button>
    </form>
  </div>
</div>
{% endblock %}
